---
# ─────────────────────────────────────────────────────────────────────────────
# Sidekiq Configuration — 3 Priority Queues + Dead Job Queue
# ─────────────────────────────────────────────────────────────────────────────

:concurrency: 10
:timeout: 25
:max_retries: 3

# Queue weights: critical is processed 10x before default, default 5x before low
:queues:
  - [critical, 10]
  - [default,  5]
  - [low,      1]

:dead_max_jobs: 10_000
:dead_timeout_in_seconds: 2_592_000  # 30 days

:logfile: log/sidekiq.log

:redis:
  url: <%= ENV.fetch("REDIS_URL", "redis://localhost:6379/0") %>
  network_timeout: 5
